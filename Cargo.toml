[workspace]
resolver = "2"
members = ["crates/bv-engine", "crates/bv-core", "crates/bv-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/edwin580/better-video"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
