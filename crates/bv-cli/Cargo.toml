[package]
name = "bv-cli"
description = "better-video: record your screen, export a small GIF/MP4 for PRs"
version.workspace = true
edition.workspace = true

[[bin]]
name = "bv"
path = "src/main.rs"

[features]
default = ["input"]
# Global mouse/keyboard access: cursor tracking for --zoom/--clicks and the
# `bv hotkey` mode. Requires X11 libs on Linux.
input = ["dep:device_query"]
# Menu bar / system tray app (`bv tray`). On Linux needs GTK 3,
# libayatana-appindicator3 and libxdo dev packages.
tray = ["input", "dep:tray-icon", "dep:tao"]

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
bv-core = { path = "../bv-core" }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
device_query = { version = "2", optional = true }
tray-icon = { version = "0.26.1", optional = true }
tao = { version = "0.37.1", optional = true }
