[package]
name = "bv-cli"
description = "better-video: record your screen, export a small GIF/MP4 for PRs"
version.workspace = true
edition.workspace = true

[[bin]]
name = "bv"
path = "src/main.rs"

[features]
default = ["input"]
# Global mouse/keyboard access: cursor tracking for --zoom/--clicks and the
# `bv hotkey` mode. Requires X11 libs on Linux.
input = ["dep:device_query"]
# Menu bar / system tray app (`bv tray`). On Linux needs GTK 3,
# libayatana-appindicator3 and libxdo dev packages.
tray = ["input", "dep:tray-icon", "dep:tao"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
bv-core = { path = "../bv-core" }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
device_query = { version = "2", optional = true }
tray-icon = { version = "0.26.1", optional = true }
tao = { version = "0.37.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The folder picker (COM). Same version bv-engine and tao use.
windows = { version = "0.62", features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
